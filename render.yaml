services:
  - type: web
    name: honeyvision-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://honeyvision.in
      - key: CORS_ORIGIN
        value: https://honeyvision.in
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: EMAIL_FROM
        value: no-reply@honeyvision.in

